# Forgejo copy of .github/workflows/tests.yml (decision 0056): the same
# jobs, with a runs-on line on each call of a reusable workflow,
# because Forgejo runs a called workflow on the runner of the caller.
# Coverage gate for turnkey-chroot: 95 percent, the bar for the one file our
# changes touch (COVERAGE.md). master measures 44 percent with the upstream
# tests; fix/umount-in-lxc brings the file to 100 percent, so pull requests
# from it pass while master alone does not. The check is "tests / coverage".
name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 95
      package: chroot
